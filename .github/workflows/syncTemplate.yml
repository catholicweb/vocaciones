name: Sync from Template

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check if this is the template repo
        run: |
          if [ "${{ github.repository }}" == "catholicweb/web-template" ]; then
            echo "This is the template repository. Skipping sync."
            exit 0
          fi

      - name: Checkout child repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add template as upstream remote
        run: |
          git remote add upstream https://github.com/catholicweb/web-template.git || true
          git fetch upstream

      - name: Merge template changes (template wins on conflicts)
        run: |
          git merge upstream/main -X theirs --no-edit --allow-unrelated-histories

      - name: Revert workflow and other updates
        run: |
          git restore HEAD -- .github/workflows

      - name: Push changes to repository
        run: |
          git push origin main
